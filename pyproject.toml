[project]
name = "rfantibody"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = "==3.10.*"
authors = [
    { name = "Nate Bennett", email = "nrbennett2@gmail.com" },
    { name = "Joe Watchwell", email = "joe.watchwell@gmail.com" }
]
dependencies = [
    # The accelerator build of torch is supplied by the runtime stack:
    # * Ascend NPU: the validated system torch + torch_npu + CANN stack is
    #   inherited with `uv venv --system-site-packages`.
    # * NVIDIA CUDA: install requirements-cuda.txt first; it pins torch 2.3.*
    #   with the cu118 build and the matching DGL wheel.
    "torch>=2.0,<2.6",
    "numpy>=1.0,<2.0",
    "hydra-core",
    "icecream",
    "opt-einsum",
    "biotite>=0.38.0",
    "e3nn",
    "pyrsistent",
    "click>=8.0.0",
    "pandas",
]

[project.optional-dependencies]
# Test tooling plus the real CPU DGL build. DGL is used as the independent
# reference for graph-operator parity and by the original repository tests; it
# is never the execution route of the migrated NPU product path.
test = [
    "pytest>=8.0.0",
    "isort>=5.13.2",
    "dgl==1.1.3",
]
# CUDA installation path. Install with:
#   python -m pip install -r requirements-cuda.txt
#   python -m pip install --no-deps -e .
cuda = [
    "torch==2.3.*",
    "torchaudio==2.3.*",
    "torchvision==0.18.*",
    "cuda-python==11.8",
]
# Ascend NPU installation path: torch, torch_npu and CANN come from the
# validated vendor stack, so this extra intentionally installs nothing extra.
npu = []

[project.scripts]
# Quiver utilities
qvls = "rfantibody.cli.quiver:qvls"
qvextract = "rfantibody.cli.quiver:qvextract"
qvextractspecific = "rfantibody.cli.quiver:qvextractspecific"
qvscorefile = "rfantibody.cli.quiver:qvscorefile"
qvsplit = "rfantibody.cli.quiver:qvsplit"
qvslice = "rfantibody.cli.quiver:qvslice"
qvrename = "rfantibody.cli.quiver:qvrename"
qvfrompdbs = "rfantibody.cli.quiver:qvfrompdbs"
# Inference commands
rfdiffusion = "rfantibody.cli.inference:rfdiffusion"
proteinmpnn = "rfantibody.cli.inference:proteinmpnn"
rf2 = "rfantibody.cli.inference:rf2"

# CUDA-only dependency overrides live in requirements-cuda.txt so that the
# default (NPU/CPU) resolution never replaces the validated vendor torch stack.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/rfantibody",
    "include/SE3Transformer/se3_transformer",
    "test",
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["rfantibody"]
